[package]
name = "uicr-fix"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[dependencies]
heapless = "0.8"

[target.'cfg(target_arch = "arm")'.dependencies]
cortex-m = { version = "0.7.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7.5"
nrf52840-hal = "0.19.0"
usb-device = "0.3.2"
usbd-serial = "0.2.2"
panic-halt = "1.0.0"

[[bin]]
name = "uicr-fix"
path = "src/main.rs"
test = false
bench = false

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
